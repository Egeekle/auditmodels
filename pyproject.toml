[project]
name = "auditmodels"
version = "0.1.0"
description = "AI Model Auditing Framework and Interactive Dashboard"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "plotly>=6.9.0",
    "scikit-learn>=1.2.0",
    "streamlit>=1.60.0",
    "torch>=2.13.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
# gitpython < 3.1.57 (pulled in transitively by streamlit) is affected by
# GHSA-3f7w-8rr8-f37f, GHSA-539m-9xh6-q6rr and GHSA-p538-c434-8v24.
constraint-dependencies = ["gitpython>=3.1.57"]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
]

[project.scripts]
auditmodels = "auditmodels.cli:main"
